server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The API is served from the same origin, so the browser needs no CORS.
  location /api/ {
    proxy_pass http://api:5555;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Long-cache fingerprinted assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routing: unknown paths fall back to the SPA
  location / {
    try_files $uri /index.html;
  }
}
